name: '[DEVINT3/PREPROD2] Validate Code'

on:
  workflow_dispatch:
  #push:
  pull_request:
    types:
      - opened
      - synchronize  
    branches:
      - 'int'
      - 'int2'
    paths:
      - 'force-app/**'

jobs:
  Validation:
    runs-on: ubuntu-latest
    steps:
      - name: 'Install Salesforce CLI'
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          ~/sfdx/bin/sfdx version

      - name: 'Install Salesforce SFDX Git Delta'
        run: |
          echo y | sfdx plugins:install sfdx-git-delta
          sfdx plugins

      - name: 'Checkout Source Code'
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set environment if int
        if: github.event.pull_request.base.ref == 'refs/heads/int'
        run: |
          echo "environment=int" >> $GITHUB_ENV
          echo "auth_url=${{secrets.INT_URL}}" >> $GITHUB_ENV

      - name: Set environment if int2
        if: startsWith(github.event.pull_request.base.ref, 'refs/heads/int2')
        run: |
          echo "environment=int2" >> $GITHUB_ENV
          echo "auth_url=${{secrets.INT_URL}}" >> $GITHUB_ENV          

      - name: Print environment
        run: |
          echo "environment: ${{env.environment}}"
          echo "url: ${{env.auth_url}}"

