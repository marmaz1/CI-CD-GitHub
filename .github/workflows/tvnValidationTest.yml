      - name: 'Prepare Changed Files to Validate'
        run: |
          mkdir changed-sources
          sfdx sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: 'Setup Auth Url File'
        run: |
          echo ${{ secrets.INT_URL}} > ./INT_URL.txt


      - name: 'Authenticate to Target Environment'
        run: sfdx auth:sfdxurl:store -f ./INT_URL.txt -s -a ${{env.environment}}

